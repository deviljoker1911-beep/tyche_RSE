name: security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily scan against the latest advisory DB — vulnerabilities discovered
    # after we land code still need to surface.
    - cron: '0 4 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo deny (bans / licenses / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # We rely on cargo-audit for the advisories check (cargo-deny on
          # stable doesn't yet parse CVSS 4.0 advisory entries).
          command: check bans licenses sources

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container: returntocorp/semgrep:latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - run: |
          semgrep ci --config p/default --config p/rust --config p/typescript --config p/solidity \
            --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-rust:
    name: codeql / rust
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - uses: github/codeql-action/analyze@v3

  codeql-ts:
    name: codeql / typescript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm audit --audit-level=high
        continue-on-error: false
