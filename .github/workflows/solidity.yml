name: solidity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: forge build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: forge install (pinned)
        working-directory: contracts
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install --no-git --shallow \
              foundry-rs/forge-std@v1.9.4 \
              OpenZeppelin/openzeppelin-contracts@v5.0.2 \
              Vectorized/solady@v0.1.16
          fi
      - name: forge build
        working-directory: contracts
        run: forge build --sizes
      - name: forge test
        working-directory: contracts
        run: forge test -vvv
      - name: forge coverage
        working-directory: contracts
        run: forge coverage --report summary
      - name: forge gas snapshot
        working-directory: contracts
        run: forge snapshot --diff
        continue-on-error: true

  slither:
    name: slither static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: forge install (pinned)
        working-directory: contracts
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install --no-git --shallow \
              foundry-rs/forge-std@v1.9.4 \
              OpenZeppelin/openzeppelin-contracts@v5.0.2 \
              Vectorized/solady@v0.1.16
          fi
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          fail-on: high
          slither-config: contracts/slither.config.json
        continue-on-error: false
