[workspace]
resolver = "2"
members = [
    "crates/tyche-types",
    "crates/tyche-crypto",
    "crates/tyche-sim",
    "crates/tyche-attest",
    "crates/tyche-fed",
    "crates/tyche-wasm",
    "crates/tyche-py",
    "crates/tyche-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["The Tyche Authors"]
license = "Apache-2.0"
repository = "https://github.com/tyche-org/tyche"
homepage = "https://tyche.network"
readme = "README.md"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde-wasm-bindgen = "0.6"
thiserror = "1.0"
anyhow = "1.0"

# Async / runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Numerics / RNG
rand = "0.8"
rand_chacha = "0.3"
ndarray = "0.15"
nalgebra = "0.33"

# Cryptography
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
subtle = "2.5"
curve25519-dalek = { version = "4.1", features = ["serde", "digest"] }
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Wasm
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# HTTP server (scaffolded for Phase 2)
axum = "0.7"

# Test / dev
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
rstest = "0.21"

# Internal crates
tyche-types = { path = "crates/tyche-types", version = "0.1.0" }
tyche-crypto = { path = "crates/tyche-crypto", version = "0.1.0" }
tyche-sim = { path = "crates/tyche-sim", version = "0.1.0" }
tyche-attest = { path = "crates/tyche-attest", version = "0.1.0" }
tyche-fed = { path = "crates/tyche-fed", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Pragmatic allowances. The blanket pedantic/nursery groups are aspirational;
# these specific lints fire on idiomatic numerical / domain code and add noise
# without catching real defects in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_arguments = "allow"
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = "debuginfo"
