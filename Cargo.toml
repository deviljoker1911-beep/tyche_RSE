[workspace]
resolver = "2"
members = [
    "crates/tyche-types",
    "crates/tyche-crypto",
    "crates/tyche-sim",
    "crates/tyche-attest",
    "crates/tyche-fed",
    "crates/tyche-wasm",
    "crates/tyche-py",
    "crates/tyche-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["The Tyche Authors"]
license = "Apache-2.0"
repository = "https://github.com/tyche-org/tyche"
homepage = "https://tyche.network"
readme = "README.md"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
serde-wasm-bindgen = "0.6"
thiserror = "1.0"
anyhow = "1.0"

# Async / runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Numerics / RNG
rand = "0.8"
rand_chacha = "0.3"
ndarray = "0.15"
nalgebra = "0.33"

# Cryptography
sha2 = "0.10"
blake3 = "1.5"
hex = { version = "0.4", features = ["serde"] }
subtle = "2.5"
curve25519-dalek = { version = "4.1", features = ["serde", "digest"] }
ed25519-dalek = { version = "2.1", features = ["serde", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Wasm
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

# Python bindings
pyo3 = { version = "0.24", features = ["extension-module"] }

# HTTP server (scaffolded for Phase 2)
axum = "0.7"

# Test / dev
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
rstest = "0.21"

# Internal crates
tyche-types = { path = "crates/tyche-types", version = "0.1.0" }
tyche-crypto = { path = "crates/tyche-crypto", version = "0.1.0" }
tyche-sim = { path = "crates/tyche-sim", version = "0.1.0" }
tyche-attest = { path = "crates/tyche-attest", version = "0.1.0" }
tyche-fed = { path = "crates/tyche-fed", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Pragmatic allowances. The blanket pedantic/nursery groups are aspirational;
# these specific lints fire on idiomatic numerical / domain code and add noise
# without catching real defects in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_arguments = "allow"
multiple_crate_versions = "allow"
doc_markdown = "allow"
many_single_char_names = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
return_self_not_must_use = "allow"
use_self = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
# Numerical code: Horner-form polynomials are clearer than chained mul_add.
suboptimal_flops = "allow"
# f64-containing structs cannot impl Eq (NaN), so PartialEq is correct.
derive_partial_eq_without_eq = "allow"
# Doc-comment style nit that fires on numerical-method explanations.
too_long_first_doc_paragraph = "allow"
unreadable_literal = "allow"
unseparated_literal_suffix = "allow"
inconsistent_digit_grouping = "allow"
unnecessary_wraps = "allow"
significant_drop_tightening = "allow"
needless_collect = "allow"
redundant_pub_crate = "allow"
cognitive_complexity = "allow"
# Float-equality assertions are intentional in tests with controlled inputs.
float_cmp = "allow"
# Lossless casts (e.g. i32 -> f64) are accepted in numerical code.
cast_lossless = "allow"
# Builder-style test fixtures don't benefit from Default::default() + reassign warning.
field_reassign_with_default = "allow"
# Hex literal grouping warning fires on intentional brand-style seed constants.
unusual_byte_groupings = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = "debuginfo"
