[package]
name = "tyche-api"
description = "HTTP API surface for the Tyche simulation core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "tyche-api"
path = "src/main.rs"

[dependencies]
tyche-types = { workspace = true }
tyche-sim = { workspace = true }
tyche-attest = { workspace = true }
tyche-fed = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "request-id"] }
tower = { version = "0.5", features = ["limit", "load-shed"] }
http = "1.1"
