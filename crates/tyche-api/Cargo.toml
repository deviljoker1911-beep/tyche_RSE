[package]
name = "tyche-api"
description = "HTTP API surface for the Tyche simulation core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[lib]
name = "tyche_api"
path = "src/lib.rs"

[[bin]]
name = "tyche-api"
path = "src/main.rs"

[dependencies]
tyche-types = { workspace = true }
tyche-sim = { workspace = true }
tyche-attest = { workspace = true }
tyche-fed = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["time"] }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower = { version = "0.5", features = ["limit", "load-shed", "util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
http = "1.1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
