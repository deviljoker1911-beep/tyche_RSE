# cargo-deny configuration for Tyche.
#
# Run `cargo deny check` locally; `.github/workflows/security.yml` runs the
# same on every PR. Three concerns are enforced:
#
# 1. advisories — vulnerability database scan (overlaps with cargo audit but
#    `cargo-deny` is the canonical CI integration)
# 2. bans       — license + duplicate-version + banned-crate rules
# 3. sources    — only crates.io and the official rust-lang Git registry
#
# We deliberately do NOT add a top-level `[graph]` filter so transient
# dependencies are scanned too.

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "warn"
ignore = []

[licenses]
version = 2
# Apache-2.0 / MIT-style licences only. GPL family is incompatible with our
# Apache-2.0 release.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
# ring uses a multi-licence stack we don't carry transitively today but want
# to allow upstream if it appears.
name = "ring"
allow = ["LicenseRef-ring", "MIT", "ISC", "OpenSSL"]

[[licenses.clarify]]
# ring's licensing is non-standard; cargo-deny needs explicit clarification.
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # No crates that defeat memory safety silently.
    { name = "openssl" },          # we use rustls everywhere
    { name = "openssl-sys" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
