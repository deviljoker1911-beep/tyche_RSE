{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "tyche.labels" . | nindent 4 }}
    tyche.network/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "tyche.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tyche.labels" . | nindent 8 }}
        tyche.network/component: api
      annotations:
        {{- toYaml .Values.common.podAnnotations | nindent 8 }}
        # Force pod restart when secret material rotates.
        checksum/secret-refs: "{{ tpl (toYaml .Values.api.secrets) . | sha256sum }}"
    spec:
      serviceAccountName: {{ include "tyche.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.common.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: true
      topologySpreadConstraints:
        {{- toYaml .Values.common.topologySpreadConstraints | nindent 8 }}
      containers:
        - name: api
          image: {{ include "tyche.image" (dict "root" . "service" .Values.api) }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.common.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.api.service.metricsPort }}
              protocol: TCP
          env:
            - name: TYCHE_ENV
              value: {{ .Values.global.environment | quote }}
            - name: TYCHE_TENANT
              value: {{ .Values.global.tenant | quote }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: TYCHE_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.api.secrets.databaseUrl }}, key: url }
            - name: TYCHE_REDIS_URL
              valueFrom:
                secretKeyRef: { name: {{ .Values.api.secrets.redisUrl }}, key: url }
            - name: TYCHE_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.api.secrets.signingKey }}, key: ed25519 }
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: {{ .Values.api.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: {{ .Values.api.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.startup.path }}
              port: {{ .Values.api.probes.startup.port }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
