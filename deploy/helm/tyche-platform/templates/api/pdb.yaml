{{- if and .Values.api.enabled .Values.api.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "tyche.labels" . | nindent 4 }}
    tyche.network/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "tyche.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  unhealthyPodEvictionPolicy: AlwaysAllow
{{- end }}
