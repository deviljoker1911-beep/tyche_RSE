# Default values for tyche-platform.
#
# Environment-specific overrides live in deploy/kustomize/overlays/<env>/
# or are supplied through ArgoCD ApplicationSet generators.
#
# Every block below is scoped to the service it configures; "common" applies
# to every Tyche-owned pod.

global:
  # Image registry + pull secret. Tags are pinned per-service below.
  imageRegistry: ghcr.io/deviljoker1911-beep
  imagePullSecrets: []
  # Cluster-wide environment label, surfaces in every pod's `env.TYCHE_ENV`.
  environment: dev
  # Tenant slug for cell-based deploys (M5). Single tenant for spike phase.
  tenant: default

common:
  # Pod-Security-Standards-restricted baseline. Override carefully.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65532
    capabilities:
      drop: ["ALL"]
  # Labels applied to every Tyche pod for Prometheus + Cilium policy targeting.
  podLabels:
    app.kubernetes.io/part-of: tyche
    tyche.network/component: ""  # overridden per service
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
  # Affinity / topology spreading: prefer spreading across AZs, then nodes.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: tyche
  nodeSelector: {}
  tolerations: []

api:
  enabled: true
  replicaCount: 3
  image:
    repository: tyche-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    metricsPort: 9090
  ingress:
    enabled: false  # Behind a gateway (Cilium / Istio / external ALB)
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 2
  env:
    RUST_LOG: "info,tyche=debug"
    TYCHE_OTEL_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318"
  # Mounted from External Secrets Operator. Names of the K8s Secrets that
  # ESO synthesises from AWS Secrets Manager.
  secrets:
    signingKey: tyche-api-signing-key
    databaseUrl: tyche-api-database-url
    redisUrl: tyche-api-redis-url
  probes:
    liveness:
      path: /healthz
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /readyz
      port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5
      failureThreshold: 3
    startup:
      path: /healthz
      port: 8080
      failureThreshold: 30
      periodSeconds: 2

web:
  enabled: true
  replicaCount: 2
  image:
    repository: tyche-web
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1
  env:
    NEXT_PUBLIC_API_BASE: "https://api.tyche.network"
    NODE_ENV: "production"
  probes:
    liveness:
      path: /api/healthz
      port: 3000
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      path: /api/healthz
      port: 3000
      periodSeconds: 5

batcher:
  enabled: true
  # Singleton — leader election handles failover. Don't horizontally scale.
  replicaCount: 1
  image:
    repository: tyche-cli
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  command: ["/usr/bin/tyche"]
  args:
    - batch
    - --interval=hourly
    - --anchor-chain=$(ANCHOR_CHAIN_RPC)
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    RUST_LOG: "info"
  secrets:
    publisherKey: tyche-batcher-publisher-key
    rpcUrl: tyche-batcher-rpc-url
  pdb:
    enabled: false  # Singleton

networkPolicy:
  enabled: true
  # Default: deny all, then allow only known peers below.
  ingress:
    fromGateway: true
    fromObservability: true
  egress:
    toDNS: true
    toDatabase: true
    toExternalRPC: true
    toSecretsManager: true

serviceAccount:
  create: true
  # IRSA / Workload Identity ARN gets injected per env via kustomize.
  annotations: {}

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
  prometheusRules:
    enabled: true
