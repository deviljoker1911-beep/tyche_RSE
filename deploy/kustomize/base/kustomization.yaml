apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The base layer points kustomize at the rendered Helm chart. Overlays
# (dev / staging / prod) compose this base with environment-specific
# patches.
#
# Render with:
#   helm template tyche deploy/helm/tyche-platform --namespace tyche > /tmp/tyche.yaml
#   kustomize build deploy/kustomize/overlays/dev
namespace: tyche
commonLabels:
  app.kubernetes.io/managed-by: kustomize
helmCharts:
  - name: tyche-platform
    repo: oci://ghcr.io/deviljoker1911-beep/charts
    version: 0.1.0
    releaseName: tyche
    namespace: tyche
    valuesFile: values.yaml
