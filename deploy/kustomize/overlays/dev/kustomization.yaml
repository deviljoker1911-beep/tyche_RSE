apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tyche-dev
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=tyche"
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
configMapGenerator:
  - name: tyche-env
    literals:
      - TYCHE_ENV=dev
      - TYCHE_LOG_LEVEL=debug
