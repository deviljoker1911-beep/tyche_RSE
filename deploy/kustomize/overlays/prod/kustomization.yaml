apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tyche-prod
resources:
  - ../../base
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: tyche-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 6
      - op: replace
        path: /spec/maxReplicas
        value: 50
  - target:
      kind: PodDisruptionBudget
      name: tyche-api
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 4
configMapGenerator:
  - name: tyche-env
    literals:
      - TYCHE_ENV=prod
      - TYCHE_LOG_LEVEL=info
labels:
  - pairs:
      tyche.network/criticality: tier-1
