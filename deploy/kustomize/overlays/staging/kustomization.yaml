apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tyche-staging
resources:
  - ../../base
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: tyche-api
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 8
configMapGenerator:
  - name: tyche-env
    literals:
      - TYCHE_ENV=staging
      - TYCHE_LOG_LEVEL=info
