# OpenTelemetry Collector — ingest from Tyche services, fan out to:
#   - Tempo (traces)
#   - Loki  (logs)
#   - Prometheus remote-write (metrics)
#   - Sentry (errors / exceptions)
#
# Deploy as a DaemonSet via opentelemetry-collector-contrib.

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
  prometheus:
    config:
      scrape_configs:
        - job_name: tyche-api
          static_configs:
            - targets: [tyche-api.tyche-prod.svc.cluster.local:9090]

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  attributes/scrub:
    # Redact anything that looks like a portfolio identifier from traces.
    # In production Tyche should never see firm IDs — this is belt and braces.
    actions:
      - { key: tyche.firm_id, action: hash }
      - { key: http.request.body, action: delete }
  k8sattributes:
    auth_type: serviceAccount
    extract:
      metadata: [k8s.pod.name, k8s.namespace.name, k8s.node.name, k8s.deployment.name]
      labels:
        - { tag_name: tyche.component, key: tyche.network/component }
        - { tag_name: tyche.env,       key: tyche.network/env }

exporters:
  otlp/tempo:
    endpoint: tempo.observability.svc.cluster.local:4317
    tls: { insecure: true }
  loki:
    endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
  prometheusremotewrite:
    endpoint: http://prometheus-server.observability.svc.cluster.local:9090/api/v1/write
    resource_to_telemetry_conversion: { enabled: true }
  debug:
    verbosity: basic
  # Sentry export is opt-in.
  sentry:
    dsn: ${env:SENTRY_DSN}

extensions:
  health_check: { endpoint: 0.0.0.0:13133 }
  pprof:        { endpoint: 0.0.0.0:1777 }
  zpages:       { endpoint: 0.0.0.0:55679 }

service:
  extensions: [health_check, pprof, zpages]
  telemetry:
    metrics: { level: detailed }
    logs:    { level: info }
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, k8sattributes, attributes/scrub, batch]
      exporters:  [otlp/tempo]
    metrics:
      receivers:  [otlp, prometheus]
      processors: [memory_limiter, k8sattributes, batch]
      exporters:  [prometheusremotewrite]
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, k8sattributes, attributes/scrub, batch]
      exporters:  [loki]
